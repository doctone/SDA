x-temporal-db: &temporal-db
  DB: postgres12
  DB_PORT: "5432"
  POSTGRES_USER: temporal
  POSTGRES_PWD: temporal
  SQL_PASSWORD: temporal
  POSTGRES_SEEDS: postgres

x-app-env: &app-env
  DATABASE_URL: postgres://skills:skills@postgres:5432/skills
  TEMPORAL_ADDRESS: temporal:7233
  TEMPORAL_NAMESPACE: default
  TEMPORAL_TASK_QUEUE: hn-ingestion

x-app: &app
  build: .
  image: sda-app:dev
  environment: *app-env
  volumes:
    - .:/app
    - /app/node_modules
    - /app/.next

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  temporal-schema:
    image: temporalio/admin-tools:1.32.0
    depends_on:
      postgres:
        condition: service_healthy
    environment: *temporal-db
    volumes:
      - ./docker/temporal:/scripts:ro
    entrypoint: ["/bin/sh", "/scripts/setup-schema.sh"]

  temporal:
    image: temporalio/server:1.32.0
    depends_on:
      temporal-schema:
        condition: service_completed_successfully
    environment:
      <<: *temporal-db
      BIND_ON_IP: 0.0.0.0
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    ports:
      - "7233:7233"
    volumes:
      - ./docker/temporal/dynamicconfig:/etc/temporal/config/dynamicconfig:ro
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "7233"]
      interval: 2s
      timeout: 3s
      start_period: 20s
      retries: 60

  temporal-namespace:
    image: temporalio/admin-tools:1.32.0
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      DEFAULT_NAMESPACE: default
    volumes:
      - ./docker/temporal:/scripts:ro
    entrypoint: ["/bin/sh", "/scripts/create-namespace.sh"]

  temporal-ui:
    image: temporalio/ui:2.54.1
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      - "8233:8080"

  migrate:
    <<: *app
    depends_on:
      postgres:
        condition: service_healthy
    command: ["pnpm", "exec", "tsx", "scripts/migrate.ts"]

  worker:
    <<: *app
    depends_on:
      migrate:
        condition: service_completed_successfully
      temporal-namespace:
        condition: service_completed_successfully
    command: ["pnpm", "exec", "tsx", "watch", "--clear-screen=false", "--include", "src/**/*.ts", "src/temporal/worker.ts"]
    restart: unless-stopped

  web:
    <<: *app
    depends_on:
      migrate:
        condition: service_completed_successfully
      temporal-namespace:
        condition: service_completed_successfully
    command: ["pnpm", "exec", "next", "dev", "-H", "0.0.0.0", "-p", "3000"]
    ports:
      - "3000:3000"

volumes:
  postgres-data:
